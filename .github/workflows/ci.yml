name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never cancel a run on master part-way, as it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-pages:
    needs: [lint, unit, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # css and js go in a folder per version, so a deploy can never be served a mix of cached old and new files.
          VERSION="${GITHUB_SHA::7}"
          mkdir -p "_site/${VERSION}"
          cp -r index.html img *.png favicon.ico \
                browserconfig.xml crossdomain.xml humans.txt robots.txt _site/
          cp -r css js "_site/${VERSION}/"
          sed -i -e "s|href=\"css/|href=\"${VERSION}/css/|" \
                 -e "s|src=\"js/main.js\"|src=\"${VERSION}/js/main.js\"|" \
                 -e "s|<meta name=\"app-version\" content=\"\">|<meta name=\"app-version\" content=\"${VERSION}\">|" \
                 _site/index.html
          ! grep -qE "href=\"css/|src=\"js/" _site/index.html
          grep -q "src=\"${VERSION}/js/main.js\"" _site/index.html
          grep -q "<meta name=\"app-version\" content=\"${VERSION}\">" _site/index.html
          # open tabs compare this against their own version, and reload when it differs.
          printf '%s' "${VERSION}" > _site/version.txt
          # base_path is e.g. "/interval-timer", or empty for a root/custom domain.
          sed -i "s|<base href=\"/\">|<base href=\"${BASE_PATH}/\">|" _site/index.html
          grep -q "<base href=\"${BASE_PATH}/\">" _site/index.html
          # Pages serves 404.html for unknown paths, so deep links like /timer/<id> load the app.
          cp _site/index.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
