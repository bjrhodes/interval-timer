name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p _site
          cp -r index.html 404.html css js img *.png favicon.ico \
                browserconfig.xml crossdomain.xml humans.txt robots.txt _site/
          # base_path is e.g. "/interval-timer", or empty for a root/custom domain.
          sed -i "s|<meta name=\"base-path\" content=\"\">|<meta name=\"base-path\" content=\"${BASE_PATH}/\">|" _site/index.html
          grep -q "<meta name=\"base-path\" content=\"${BASE_PATH}/\">" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
